<style>
  :root{
    --bg:#0a0e1a; --panel:#141b2e; --panel2:#1b2540; --line:#2a3654;
    --ink:#e8ecf6; --muted:#8a95b0; --accent:#6f8cff; --accent2:#8a5cff;
    --done:#37d39a; --todo:#3a4666;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased; padding:28px 16px 90px;
  }
  .wrap{max-width:860px; margin:0 auto}
  h1{font-size:21px; letter-spacing:1.5px; text-transform:uppercase; margin:0 0 4px}
  .sub{color:var(--muted); font-size:13px; margin:0 0 22px; line-height:1.5}
  .bar-wrap{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; position:sticky; top:10px; z-index:5}
  .bar-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; flex-wrap:wrap; gap:8px}
  .bar-top .big{font-size:15px}
  .bar-top .pct{font-size:26px; font-weight:700; color:var(--accent)}
  .track{height:12px; background:var(--panel2); border-radius:8px; overflow:hidden}
  .fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:8px; transition:width .35s ease}
  .controls{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px}
  button{
    background:var(--panel2); color:var(--muted); border:1px solid var(--line);
    border-radius:8px; padding:8px 13px; font-family:inherit; font-size:12px; cursor:pointer;
  }
  button:hover{color:var(--ink); border-color:var(--accent)}
  .phase{background:var(--panel); border:1px solid var(--line); border-radius:11px; margin-bottom:10px; overflow:hidden}
  .phase-head{display:flex; align-items:center; gap:14px; padding:14px 18px; cursor:pointer; user-select:none}
  .phase-head:hover{background:var(--panel2)}
  .chev{color:var(--muted); font-size:12px; width:14px; transition:transform .15s; flex:0 0 auto}
  .phase.open .chev{transform:rotate(90deg)}
  .pnum{color:var(--muted); font-size:12px; flex:0 0 auto}
  .pname{flex:1; font-size:15px; font-weight:600}
  .pcount{color:var(--muted); font-size:12px; flex:0 0 auto; min-width:52px; text-align:right}
  .pmini{width:80px; height:7px; background:var(--panel2); border-radius:5px; overflow:hidden; flex:0 0 auto}
  .pmini > i{display:block; height:100%; width:0%; background:var(--done); border-radius:5px; transition:width .3s}
  .lessons{display:none; padding:4px 10px 12px; border-top:1px solid var(--line)}
  .phase.open .lessons{display:block}
  .lesson{display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:8px; cursor:pointer}
  .lesson:hover{background:var(--panel2)}
  .box{width:19px; height:19px; border-radius:5px; border:2px solid var(--todo); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:12px; color:#0a0e1a}
  .lesson.done .box{background:var(--done); border-color:var(--done)}
  .lnum{color:var(--muted); font-size:11px; width:24px; flex:0 0 auto}
  .lname{flex:1; font-size:13.5px}
  .lesson.done .lname{color:var(--muted); text-decoration:line-through}
  .foot{color:var(--muted); font-size:12px; margin-top:18px; text-align:center}
  @media (prefers-color-scheme:light){
    :root{--bg:#f4f6fc; --panel:#fff; --panel2:#eef1fa; --line:#d9e0f0; --ink:#1a2340; --muted:#67728f; --todo:#c2cadf}
    .box{color:#fff}
  }
</style>
</head>

function pretty(slug){
  const parts = slug.split("-");
  if(/^\d+$/.test(parts[0])) parts.shift();
  return parts.map(w=>{
    const lw=w.toLowerCase();
    if(ACR.has(lw)) return w.toUpperCase();
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join(" ");
}

    '<span class="chev">▶</span>'+
    '<span class="pnum">'+pnum+'</span>'+
    '<span class="pname">'+name+'</span>'+
    '<span class="pmini"><i></i></span>'+
    '<span class="pcount">0/'+lessons.length+'</span>'+
    '</div><div class="lessons">';
  lessons.forEach((s,li)=>{
    const id=pi+"/"+s;
    const isDone=done.has(id);
    html+='<div class="lesson'+(isDone?" done":"")+'" data-id="'+id+'">'+
      '<span class="box">'+(isDone?"✓":"")+'</span>'+
      '<span class="lnum">'+s.split("-")[0]+'</span>'+
      '<span class="lname">'+pretty(s)+'</span>'+
      '</div>';
  });
  html+='</div>';
  sec.innerHTML=html;
  sec.querySelector(".phase-head").addEventListener("click",()=>sec.classList.toggle("open"));
  sec.querySelectorAll(".lesson").forEach(el=>{
    el.addEventListener("click",()=>{
      const id=el.dataset.id;
      if(done.has(id)){ done.delete(id); el.classList.remove("done"); el.querySelector(".box").textContent=""; }
      else{ done.add(id); el.classList.add("done"); el.querySelector(".box").textContent="✓"; }
      save(); refreshPhase(pi); refreshTotals();
    });
  });
  root.appendChild(sec);
});

document.getElementById("expandAll").addEventListener("click",()=>root.querySelectorAll(".phase").forEach(s=>s.classList.add("open")));
document.getElementById("collapseAll").addEventListener("click",()=>root.querySelectorAll(".phase").forEach(s=>s.classList.remove("open")));
document.getElementById("reset").addEventListener("click",()=>{
  if(confirm("Reset ALL lesson progress?")){ done=new Set(); save();
    root.querySelectorAll(".lesson").forEach(el=>{el.classList.remove("done"); el.querySelector(".box").textContent="";});
    PHASES.forEach((p,pi)=>refreshPhase(pi)); refreshTotals();
  }
});

PHASES.forEach((p,pi)=>refreshPhase(pi));
refreshTotals();
if(done.size) save();
</script>
</body>
</html>
